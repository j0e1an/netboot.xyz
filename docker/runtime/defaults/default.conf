server {
  listen ${NGINX_PORT} default_server;
  listen [::]:${NGINX_PORT} default_server;
  server_name _;

  # Same tree as TFTP so http://${boot_domain}/menu.ipxe and /wimboot work
  root /config/menus;
  autoindex on;

  location / {
    try_files $uri $uri/ =404;
  }

  location /assets/ {
    alias /assets/;
    autoindex on;
  }
}
