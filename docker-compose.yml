---
# Convenience wrapper: build/run the full stack from the sibling webapp repo.
# On the Docker host prefer:
#   cd ~/webapp && docker compose -f docker-compose.server.yml up -d --build

services:
  netbootxyz:
    build:
      context: ../webapp
      dockerfile: Dockerfile
    image: netbootxyz-webapp:local
    container_name: netbootxyz
    environment:
      PUID: "911"
      PGID: "911"
      NGINX_PORT: "80"
      WEB_APP_PORT: "3000"
      BOOT_DOMAIN: "${BOOT_DOMAIN:-192.168.1.50:8080}"
      WINDOWS_ASSETS_URL: "http://${BOOT_DOMAIN:-192.168.1.50:8080}"
      WINDOWS_PORTAL_URL: "http://${BOOT_DOMAIN:-192.168.1.50:8080}"
    volumes:
      - ${NETBOOT_CONFIG:-../webapp/data/config}:/config
      - ${NETBOOT_ASSETS:-../webapp/data/assets}:/assets
    ports:
      - "3000:3000"
      - "69:69/udp"
      - "8080:80"
    restart: unless-stopped
