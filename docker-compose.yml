---
# Build & run netboot.xyz from THIS repo with bootloaders at TFTP root.
#
# On joe-virtual-machine (example):
#   cd /home/joe/src/netboot.xyz   # synced copy of this repo
#   docker compose up -d --build
#
# UniFi Network Boot:
#   Server: 192.168.1.50
#   File:   netboot.xyz.efi   (UEFI) or netboot.xyz.kpxe (BIOS)

services:
  netbootxyz:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        # HTTP host:port clients use after iPXE loads (nginx in this container)
        BOOT_DOMAIN: "${BOOT_DOMAIN:-192.168.1.50:8080}"
        NBXYZ_OVERRIDES: "${NBXYZ_OVERRIDES:-default}"
    image: netbootxyz:local
    container_name: netbootxyz
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      NGINX_PORT: 80
      # Can override boot.cfg at start without rebuilding bootloaders
      BOOT_DOMAIN: "${BOOT_DOMAIN:-192.168.1.50:8080}"
    volumes:
      - netbootxyz-config:/config
      - netbootxyz-assets:/assets
    ports:
      - "3000:3000"   # unused by runtime image (no webapp); kept for compatibility
      - "69:69/udp"
      - "8080:80"
    # Use host networking if you need TFTP on all NICs (ens160 + ens192) without NAT
    # network_mode: host
    restart: unless-stopped

volumes:
  netbootxyz-config:
  netbootxyz-assets:
